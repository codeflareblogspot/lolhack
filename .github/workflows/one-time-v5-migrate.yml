name: One-Time CodeFlare Tools v5.1 Migration and Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v5-migrate.yml'
permissions:
  contents: read
concurrency:
  group: codeflare-tools
  cancel-in-progress: false
jobs:
  migrate-and-deploy:
    if: ${{ github.event.head_commit.message == 'ops: one-time v5.1 Tools migration and deploy' }}
    environment: codeflare-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Tools-only target and config
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ vars.CODEFLARE_TOOLS_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT"
          test -n "$CF_TOKEN"
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          test -f database/migrations/0001_members.sql
          node --check backend/src/index.js
          cat > wrangler.toml <<EOF
          name = "codeflare-tools"
          main = "backend/src/index.js"
          compatibility_date = "2026-10-11"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "codeflare_tools_v5"
          database_id = "$D1_ID"
          EOF
      - name: Create only cft_ tables if absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0001_members.sql
      - name: Fail-closed D1 schema check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT CASE WHEN
            (SELECT COUNT(*) FROM pragma_table_info('cft_users') WHERE name IN ('id','username','email','password_hash','status','created_at','updated_at')) = 7
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_sessions') WHERE name IN ('user_id','token_hash','expires_at','created_at')) = 4
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_activity_events') WHERE name IN ('user_id','event_type','page_path','created_at')) = 4
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_login_limits') WHERE name IN ('identity_hash','attempts','updated_at')) = 3
          THEN 1 ELSE 0 END AS schema_ok;"
          npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --command "$SQL" --json > schema-check.json
          node - <<'JS'
          const x = JSON.parse(require('node:fs').readFileSync('schema-check.json', 'utf8'));
          const vals = [];
          function walk(v) {
            if (v && typeof v === 'object') {
              if (Object.hasOwn(v,'schema_ok')) vals.push(Number(v.schema_ok));
              for (const o of Object.values(v)) walk(o);
            }
          }
          walk(x);
          if (vals.length !== 1 || vals[0] !== 1) throw Error('Incompatible D1 schema. Deploy blocked.');
          console.log('Tools D1 schema verified.');
          JS
      - name: Deploy only codeflare-tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify version 5.1.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://codeflare-tools.fjreggy.workers.dev/health > health.json
          node -e "const x=require('./health.json'); if(x.version!=='5.1.0'||!x.dbConfigured)process.exit(1); console.log('CodeFlare Tools 5.1.0 healthy')"
