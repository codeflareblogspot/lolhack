name: Deploy CodeFlare Tools
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/migrations/**'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Registered CodeFlare project ID'
        required: true
        type: string
      worker_name:
        description: 'Exact Cloudflare Worker target'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      expected_version:
        description: 'Expected CodeFlare project version'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codeflare-tools
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (inputs.project_id == 'codeflare-tools' && inputs.worker_name == 'codeflare-tools' && inputs.environment == 'production' && inputs.expected_version == '5.1.0') }}
    runs-on: ubuntu-latest
    environment: codeflare-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ vars.CODEFLARE_TOOLS_D1_DATABASE_ID }}
          DEPLOY_PROJECT: ${{ inputs.project_id || 'codeflare-tools' }}
          DEPLOY_WORKER: ${{ inputs.worker_name || 'codeflare-tools' }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          EXPECTED_VERSION: ${{ inputs.expected_version || '5.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_PROJECT" = "codeflare-tools" || { echo "Wrong project target"; exit 1; }
          test "$DEPLOY_WORKER" = "codeflare-tools" || { echo "Wrong Worker target"; exit 1; }
          test "$DEPLOY_ENVIRONMENT" = "production" || { echo "Wrong deployment environment"; exit 1; }
          test "$EXPECTED_VERSION" = "5.1.0" || { echo "Unexpected project version"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Missing/invalid CODEFLARE_TOOLS_D1_DATABASE_ID"; exit 1; }
          test -f backend/src/index.js
          node --check backend/src/index.js
          node tests/contracts.mjs
      - name: Write Tools-only Wrangler config
        env:
          D1_ID: ${{ vars.CODEFLARE_TOOLS_D1_DATABASE_ID }}
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "codeflare-tools"
          main = "backend/src/index.js"
          compatibility_date = "2026-10-11"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "codeflare_tools_v5"
          database_id = "$D1_ID"
          EOF
      - name: Apply isolated cft_ migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0001_members.sql
      - name: Apply isolated scope and earnings migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0002_scopes_earnings.sql
      - name: Apply activity audit migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0003_activity_audit.sql
      - name: Apply member settings and chat migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0004_member_settings_chat.sql
      - name: Apply isolated commission engine migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0005_commission_engine.sql
      - name: Apply isolated payout reporting migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0006_payout_reporting.sql
      - name: Apply member dashboard content migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --file database/migrations/0007_member_dashboard_content.sql
      - name: Validate member database schema (read-only, fail closed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT CASE WHEN
            (SELECT COUNT(*) FROM pragma_table_info('cft_users') WHERE name IN ('id','username','email','password_hash','status','created_at','updated_at')) = 7
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_sessions') WHERE name IN ('user_id','token_hash','expires_at','created_at')) = 4
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_activity_events') WHERE name IN ('user_id','event_type','page_path','created_at')) = 4
            AND (SELECT COUNT(*) FROM pragma_table_info('cft_login_limits') WHERE name IN ('identity_hash','attempts','updated_at')) = 3
          THEN 1 ELSE 0 END AS schema_ok;"
          npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --command "$SQL" --json > schema-check.json
          node - <<'JS'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('schema-check.json','utf8'));
          const values = [];
          function walk(o) {
            if (o && typeof o === 'object') {
              if (Object.hasOwn(o, 'schema_ok')) values.push(Number(o.schema_ok));
              for (const v of Object.values(o)) walk(v);
            }
          }
          walk(x);
          if (values.length !== 1 || values[0] !== 1) {
            console.error('D1 schema incompatible or incomplete; deployment blocked. No D1 changes made.');
            process.exit(1);
          }
          console.log('D1 schema preflight passed.');
          JS
      - name: Deploy Tools only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 3 https://codeflare-tools.fjreggy.workers.dev/health
# No Composer project names, routes, or credentials.
