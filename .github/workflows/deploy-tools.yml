name: Deploy CodeFlare Tools (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type codeflare-tools to confirm the ONLY allowed target'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codeflare-tools-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm_target == 'codeflare-tools' }}
    runs-on: ubuntu-latest
    environment: codeflare-tools-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and secrets
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ vars.CODEFLARE_TOOLS_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ "$D1_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Missing/invalid CODEFLARE_TOOLS_D1_DATABASE_ID"; exit 1; }
          test -f backend/src/index.js
          node --check backend/src/index.js
      - name: Write Tools-only Wrangler config
        env:
          D1_ID: ${{ vars.CODEFLARE_TOOLS_D1_DATABASE_ID }}
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "codeflare-tools"
          main = "backend/src/index.js"
          compatibility_date = "2026-10-11"
          workers_dev = true
          [[d1_databases]]
          binding = "DB"
          database_name = "codeflare_tools_v5"
          database_id = "$D1_ID"
          EOF
      - name: Validate database schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute codeflare_tools_v5 --remote --config wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('cf_users','cf_sessions','cf_activity_events','cf_login_limits') ORDER BY name;"
      - name: Deploy Tools only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 3 https://codeflare-tools.fjreggy.workers.dev/health
# No Composer project names, routes, or credentials.
